{% extends 'base.html' %}
{% block content %}

<div class="add-wrapper">
  <div class="add-card">
    <h2>🧁 Add a New Recipe</h2>
    <p class="subtitle">Share your delicious cake creation with the world 🍓</p>

    <form action="{{ url_for('add') }}" method="POST" enctype="multipart/form-data" class="add-form">
      
      <label for="title">Cake Title</label>
      <input type="text" id="title" name="title" placeholder="e.g., Chocolate Fudge Delight" required>

      <label for="ingredients">Ingredients</label>
      <textarea id="ingredients" name="ingredients" rows="4" placeholder="List all ingredients..." required></textarea>

      <label for="recipe">Recipe Instructions</label>
      <textarea id="recipe" name="recipe" rows="6" placeholder="Step-by-step preparation..." required></textarea>

      <label for="image">Upload Cake Image</label>
      <input type="file" id="image" name="image" accept="image/*">

      <button type="submit" class="btn-submit">✨ Add Recipe</button>
    </form>
  </div>
</div>

<style>
  .add-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 85vh;
    background: linear-gradient(to bottom, #fff1f8, #ffffff);
  }

  .add-card {
    background: #fff;
    padding: 45px 60px;
    border-radius: 22px;
    box-shadow: 0 8px 25px rgba(214, 51, 132, 0.12);
    max-width: 600px;
    width: 90%;
    border: 1px solid #ffe1ec;
    text-align: left;
    animation: fadeIn 0.5s ease;
  }

  .add-card h2 {
    text-align: center;
    color: #d63384;
    font-size: 1.9rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .add-card .subtitle {
    text-align: center;
    color: #777;
    font-size: 0.95rem;
    margin-bottom: 25px;
  }

  .add-form label {
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
    display: block;
  }

  .add-form input[type="text"],
  .add-form textarea,
  .add-form input[type="file"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.6px solid #f7c1d6;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 18px;
    background: #fff9fb;
    transition: 0.3s;
  }

  .add-form input:focus,
  .add-form textarea:focus {
    border-color: #e85c9e;
    box-shadow: 0 0 6px rgba(232, 92, 158, 0.3);
    outline: none;
  }

  .btn-submit {
    background: linear-gradient(90deg, #ff7ab8, #e85c9e);
    color: white;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
    display: block;
    width: 100%;
    text-align: center;
    transition: 0.3s ease;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(214, 51, 132, 0.25);
  }

  @media (max-width: 680px) {
    .add-card {
      padding: 30px;
    }
  }
</style>

{% endblock %}
