{% extends 'base.html' %}
{% block content %}

<div class="view-container">
  <div class="view-card">
    <!-- Recipe Image -->
    {% if recipe.image %}
      <img src="{{ url_for('static', filename='uploads/' + recipe.image) }}" alt="{{ recipe.title }}" class="view-img">
    {% else %}
      <img src="{{ url_for('static', filename='default.jpg') }}" alt="No Image" class="view-img">
    {% endif %}

    <!-- Title -->
    <h2 class="view-title">{{ recipe.title }}</h2>

    <!-- Ingredients Section -->
    <div class="view-section">
      <h3>🧁 Ingredients</h3>
      <p>{{ recipe.ingredients }}</p>
    </div>

    <!-- Instructions Section -->
    <div class="view-section">
      <h3>👩‍🍳 Recipe Instructions</h3>
      <p>{{ recipe.recipe }}</p>
    </div>

    <!-- Back Button -->
    <a href="{{ url_for('index') }}" class="back-btn">⬅ Back to All Recipes</a>
  </div>
</div>

<style>
  .view-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
    background: linear-gradient(to bottom, #fff0f7, #ffffff);
  }

  .view-card {
    background: #fff;
    max-width: 700px;
    width: 90%;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 8px 25px rgba(214, 51, 132, 0.12);
    text-align: center;
    border: 1px solid #ffe0ec;
    animation: fadeIn 0.6s ease;
  }

  .view-img {
    width: 100%;
    max-height: 380px;
    object-fit: cover;
    border-radius: 18px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(255, 182, 193, 0.25);
  }

  .view-title {
    color: #d63384;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 20px;
    text-transform: capitalize;
  }

  .view-section {
    text-align: left;
    background: #fff9fb;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 25px;
    border: 1px solid #ffd6e8;
    box-shadow: 0 2px 10px rgba(214, 51, 132, 0.05);
  }

  .view-section h3 {
    color: #d63384;
    font-size: 1.2rem;
    margin-bottom: 10px;
  }

  .view-section p {
    color: #555;
    line-height: 1.7;
    font-size: 1rem;
  }

  .back-btn {
    display: inline-block;
    background: linear-gradient(90deg, #ff7ab8, #e85c9e);
    color: white;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    transition: 0.3s ease;
  }

  .back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(214, 51, 132, 0.25);
  }

  @media (max-width: 700px) {
    .view-card {
      padding: 25px;
    }
    .view-title {
      font-size: 1.6rem;
    }
  }
</style>

{% endblock %}
