{% extends 'base.html' %}
{% block content %}

<div class="update-wrapper">
  <div class="update-card">
    <h2>🍒 Update Recipe</h2>
    <p class="subtitle">Make changes to your delicious cake creation ✨</p>

    <form action="{{ url_for('update', id=recipe.id) }}" method="POST" enctype="multipart/form-data" class="update-form">
      
      <label for="title">Cake Title</label>
      <input type="text" id="title" name="title" value="{{ recipe.title }}" required>

      <label for="ingredients">Ingredients</label>
      <textarea id="ingredients" name="ingredients" rows="4" required>{{ recipe.ingredients }}</textarea>

      <label for="recipe">Recipe Instructions</label>
      <textarea id="recipe" name="recipe" rows="6" required>{{ recipe.recipe }}</textarea>

      <div class="image-preview">
        {% if recipe.image %}
          <p>Current Image:</p>
          <img src="{{ url_for('static', filename='uploads/' + recipe.image) }}" alt="Recipe Image">
        {% else %}
          <p>No image uploaded yet.</p>
        {% endif %}
      </div>

      <label for="image">Change Image (optional)</label>
      <input type="file" id="image" name="image" accept="image/*">

      <button type="submit" class="btn-update">💾 Save Changes</button>
    </form>
  </div>
</div>

<style>
  .update-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 85vh;
    background: linear-gradient(to bottom, #fff1f8, #ffffff);
  }

  .update-card {
    background: #fff;
    padding: 45px 60px;
    border-radius: 22px;
    box-shadow: 0 8px 25px rgba(214, 51, 132, 0.12);
    max-width: 600px;
    width: 90%;
    border: 1px solid #ffe1ec;
    text-align: left;
    animation: fadeIn 0.5s ease;
  }

  .update-card h2 {
    text-align: center;
    color: #d63384;
    font-size: 1.9rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .update-card .subtitle {
    text-align: center;
    color: #777;
    font-size: 0.95rem;
    margin-bottom: 25px;
  }

  .update-form label {
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
    display: block;
  }

  .update-form input[type="text"],
  .update-form textarea,
  .update-form input[type="file"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.6px solid #f7c1d6;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 18px;
    background: #fff9fb;
    transition: 0.3s;
  }

  .update-form input:focus,
  .update-form textarea:focus {
    border-color: #e85c9e;
    box-shadow: 0 0 6px rgba(232, 92, 158, 0.3);
    outline: none;
  }

  .image-preview {
    text-align: center;
    margin-bottom: 20px;
  }

  .image-preview img {
    max-width: 220px;
    border-radius: 12px;
    border: 1px solid #ffd6e8;
    box-shadow: 0 3px 10px rgba(214, 51, 132, 0.15);
  }

  .btn-update {
    background: linear-gradient(90deg, #ff7ab8, #e85c9e);
    color: white;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
    display: block;
    width: 100%;
    text-align: center;
    transition: 0.3s ease;
  }

  .btn-update:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(214, 51, 132, 0.25);
  }

  @media (max-width: 680px) {
    .update-card {
      padding: 30px;
    }
  }
</style>

{% endblock %}
